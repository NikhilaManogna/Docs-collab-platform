server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: false
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/auth/**
        - id: document-service
          uri: ${DOCUMENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/documents/**,/internal/documents/**
        - id: collaboration-rest
          uri: ${COLLABORATION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/collaboration/**
        - id: collaboration-websocket
          uri: ${COLLABORATION_WS_URL:ws://localhost:8082}
          predicates:
            - Path=/ws/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
